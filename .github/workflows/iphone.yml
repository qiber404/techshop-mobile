name: Build TechShop for iPhone

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx --no-install expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - name: Build standalone device app
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/TechShop.xcworkspace -scheme TechShop \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/techshop-build" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/techshop-build/Build/Products/Release-iphoneos/TechShop.app"
          test -s "$app/main.jsbundle"
          test -s "$app/Assets.car"
          python3 - "$app" <<'PY'
          import hashlib, pathlib, sys
          app = pathlib.Path(sys.argv[1])
          assert b'FontLoaderModule' in (app / 'TechShop').read_bytes(), 'Missing native font loader'
          assert any(app.rglob('Ionicons.ttf')), 'Missing Ionicons font'
          photos = list(pathlib.Path('assets').rglob('*.jpg'))
          embedded = {hashlib.sha256(p.read_bytes()).digest() for p in app.rglob('*.jpg')}
          assert photos and all(hashlib.sha256(p.read_bytes()).digest() in embedded for p in photos)
          PY
          lipo "$app/TechShop" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/TechShop.app"
          output="$GITHUB_WORKSPACE/TechShop.ipa"
          (cd "$RUNNER_TEMP/package" && /usr/bin/zip -qry "$output" Payload)
          shasum -a 256 TechShop.ipa > TechShop.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TechShop-iPhone
          path: |
            TechShop.ipa
            TechShop.ipa.sha256
          if-no-files-found: error
      - name: Launch the Release catalog on an iPhone simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for k in sorted(devices,reverse=True) if ".iOS-" in k for d in devices[k] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcodebuild -workspace ios/TechShop.xcworkspace -scheme TechShop \
            -configuration Release -sdk iphonesimulator -destination "id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/techshop-sim" CODE_SIGNING_ALLOWED=NO -quiet build
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/techshop-sim/Build/Products/Release-iphonesimulator/TechShop.app"
          xcrun simctl launch "$udid" kz.techshop.mobile
          swiftc tests/catalog-screen.swift -o "$RUNNER_TEMP/read-catalog"
          for attempt in {1..10}; do
            xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/catalog.png"
            if "$RUNNER_TEMP/read-catalog" "$RUNNER_TEMP/catalog.png"; then exit 0; fi
            sleep 3
          done
          xcrun simctl spawn "$udid" log show --last 2m --predicate 'process == "TechShop"' --style compact | tail -100
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-catalog-screen
          path: ${{ runner.temp }}/catalog.png
          if-no-files-found: ignore

  release:
    needs: iphone
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TechShop-iPhone
      - name: Publish IPA for personal signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c TechShop.ipa.sha256
          gh release create "$GITHUB_REF_NAME" TechShop.ipa TechShop.ipa.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "TechShop $GITHUB_REF_NAME" \
            --notes "TechShop.ipa для iPhone. Для установки подпишите файл своим Apple Account через AltServer. Инструкция — в README."
